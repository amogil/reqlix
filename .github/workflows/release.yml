# GitHub Actions workflow for automatic binary builds on release publication
# Implements: R.R.1, R.R.2-R.R.7, R.R.8, R.R.9, R.R.10, R.R.11, R.R.12, R.R.13, R.R.14, R.R.15

name: Release

# R.R.1, R.R.15: Trigger only on tag creation (v* pattern), not on branch pushes
on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '*'

jobs:
  build:
    # R.R.10: Use matrix strategy for parallel builds
    strategy:
      matrix:
        include:
          # R.R.2, R.R.11: Linux x64
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            binary_name: reqlix
            os: ubuntu-latest
          # R.R.3, R.R.11: Linux ARM
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            binary_name: reqlix
            os: ubuntu-latest
          # R.R.4, R.R.11: macOS Intel
          - target: x86_64-apple-darwin
            platform: macos-x64
            binary_name: reqlix
            os: macos-latest
          # R.R.5, R.R.11: macOS Apple Silicon
          - target: aarch64-apple-darwin
            platform: macos-arm64
            binary_name: reqlix
            os: macos-latest
          # R.R.6, R.R.11: Windows x64
          - target: x86_64-pc-windows-msvc
            platform: windows-x64
            binary_name: reqlix.exe
            os: windows-latest
          # R.R.7, R.R.11: Windows ARM
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            binary_name: reqlix.exe
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # R.R.12: Step 1 - Install Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # R.R.11, R.R.12: Step 2 - Add required target using rustup
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # Install cross-compilation tools for Linux ARM
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # R.R.12: Step 3 - Build release binary
      - name: Build release binary
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      # R.R.12: Step 4 - Locate built binary and prepare directory
      - name: Prepare binary directory
        shell: bash
        run: |
          mkdir -p dist
          BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi
          echo "BINARY_PATH=$BINARY_PATH" >> $GITHUB_ENV

      # R.R.8, R.R.12: Step 5 - Copy binary to dist with correct name
      - name: Copy binary
        shell: bash
        run: |
          cp "$BINARY_PATH" "dist/${{ matrix.binary_name }}"
          # Only chmod on Unix-like systems
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.binary_name }}"
          fi

      # Remove quarantine attribute for macOS binaries to avoid security warning
      - name: Remove quarantine attribute (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xattr -d com.apple.quarantine "dist/${{ matrix.binary_name }}" || true

      # R.R.9, R.R.13: Create ZIP archive
      - name: Create ZIP archive
        shell: bash
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          ZIP_NAME="reqlix-${VERSION}-${{ matrix.platform }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          
          # Create ZIP based on OS
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # On Windows, use PowerShell for ZIP creation
            pwsh -Command "Compress-Archive -Path '${{ matrix.binary_name }}' -DestinationPath '../$ZIP_NAME' -Force"
          else
            # On Unix-like systems, use zip command
            zip "../$ZIP_NAME" "${{ matrix.binary_name }}"
          fi
          cd ..

      # R.R.13: Verify ZIP contains only binary at root level
      - name: Verify ZIP structure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Verify ZIP contains only the binary file at root level
          ZIP_NAME="${{ env.ZIP_NAME }}"
          unzip -l "$ZIP_NAME" | grep -E "^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+${{ matrix.binary_name }}$" || exit 1

      # R.R.14: Upload artifact for later release attachment
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 1

  # R.R.14: Upload all artifacts to GitHub release
  upload-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update draft GitHub Release with artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}.
            
            See the full changelog: https://github.com/${{ github.repository }}/compare/HEAD...${{ github.ref_name }}
          files: artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

